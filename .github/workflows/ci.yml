# xtQRdecoder CI - the compiler-free gates.
#
# There is no xTalk engine in CI (OpenXTalk cannot compile or run a
# .livecodescript headlessly), so every job here is a stand-in for the compiler
# we cannot run: two static checkers, the generated-file sync gate, and the
# headless execution MODEL that runs the unit suites and the golden fixtures
# through the real .lc sources. A green run here means "verified statically and
# under the model"; it never promotes anything to engine-verified - the
# honesty label for that stays "needs an OXT pass" until a dated engine run.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: static gates + headless suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Repo linter (blocks, reserved words, bare return, undeclared writes, delimiter footgun, SPDX)
        run: python3 tools/lint_lcs.py qr lib/xtQRdecoder.livecodescript

      - name: Suite engine rules (the vendored xTalk Suite checker, 22 engine-derived rules)
        run: python3 tools/check_engine_rules.py

      - name: Combined script-only stack is in sync with the modules
        run: python3 tools/build_livecodescript.py --check

      - name: Unit suites under the headless model (modules)
        run: python3 tools/run_unit_tests.py

      - name: Unit suites under the headless model (combined stack)
        run: python3 tools/run_unit_tests.py --lib

      - name: Golden fixtures under the headless model (public API, real PNGs)
        run: python3 tools/run_golden.py

      - name: Synthetic corpus under the headless model (49 rows from an independent encoder)
        run: python3 tools/run_synthetic.py

      - name: Decoder tables regenerated from first principles and ZXing's rows
        run: python3 tools/verify_tables.py

      - name: The gates are mutation-tested (each seeded defect must be caught)
        run: python3 tools/test_gates.py

      - name: The suites are mutation-tested (each seeded library defect must go red)
        run: python3 tools/test_model_mutations.py

      - name: Synthetic corpus is in sync with its generator (pixels + manifest)
        run: |
          python3 -m pip install --quiet "qrcode==8.2"
          python3 tools/gen_synthetic_fixtures.py --check
